name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'LICENSE'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ["Auto Update Lottery Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  pages:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify generated dashboard
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/dashboard.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          print('generated_at =', d.get('generated_at'))
          print('fetch.mode =', (d.get('fetch') or {}).get('mode'))
          print('province_count =', ((d.get('xsmn') or {}).get('province_count')))
          if not d.get('generated_at'):
              raise SystemExit('dashboard.json vẫn là bản khởi tạo. Hãy chạy Auto Update Lottery Data trước.')
          PY

      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css .nojekyll _site/
          cp data/dashboard.json _site/data/dashboard.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  huggingface:
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && vars.HF_SPACE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify generated dashboard
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/dashboard.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          print('generated_at =', d.get('generated_at'))
          print('fetch.mode =', (d.get('fetch') or {}).get('mode'))
          print('province_count =', ((d.get('xsmn') or {}).get('province_count')))
          if not d.get('generated_at'):
              raise SystemExit('dashboard.json vẫn là bản khởi tạo. Hãy chạy Auto Update Lottery Data trước.')
          PY

      - name: Prepare clean Hugging Face Static Space
        run: |
          mkdir -p _hf_site/data
          cp index.html app.js style.css LICENSE _hf_site/
          cp data/dashboard.json _hf_site/data/dashboard.json
          cat > _hf_site/README.md <<'SPACE_EOF'
          ---
          title: Xổ số & Vietlott Analytics Auto
          emoji: 🎯
          colorFrom: indigo
          colorTo: blue
          sdk: static
          app_file: index.html
          pinned: false
          ---

          # Xổ số & Vietlott Analytics Auto

          Static Space được cập nhật tự động từ GitHub Actions.

          Điểm dự đoán là xếp hạng thống kê/backtest lịch sử, không phải xác suất chắc chắn trúng.
          SPACE_EOF

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Upload static site to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN', '').strip()
          repo_id = os.environ.get('HF_SPACE_ID', '').strip()
          if not token:
              raise SystemExit('Thiếu GitHub secret HF_TOKEN')
          if not repo_id:
              raise SystemExit('Thiếu GitHub variable HF_SPACE_ID')

          api = HfApi(token=token)
          api.create_repo(
              repo_id=repo_id,
              repo_type='space',
              space_sdk='static',
              exist_ok=True,
          )
          api.upload_folder(
              folder_path='_hf_site',
              repo_id=repo_id,
              repo_type='space',
              commit_message='sync: GitHub auto deploy',
          )
          print(f'Synced to Hugging Face Space: {repo_id}')
          PY
