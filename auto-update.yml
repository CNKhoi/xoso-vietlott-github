name: Auto Update Lottery Data

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '17 17 * * *'
      timezone: 'Asia/Ho_Chi_Minh'
    - cron: '47 18 * * *'
      timezone: 'Asia/Ho_Chi_Minh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lottery-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-update.txt

      - name: Install dependencies
        run: pip install -r requirements-update.txt

      - name: Update results and analytics
        env:
          BOOTSTRAP_DAYS: '730'
          INCREMENTAL_DAYS: '10'
          HTTP_TIMEOUT: '25'
          FETCH_CONCURRENCY: '6'
        run: python scripts/update_data.py

      - name: Run smoke tests
        run: python tests/smoke_test.py

      - name: Commit data if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/dashboard.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: auto update lottery results [skip auto]"
          git pull --rebase origin main
          git push origin HEAD:main
